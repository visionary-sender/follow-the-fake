[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ftf"
description = "Follow the Fake: group single scam ads and their landing pages into campaigns."
readme = "README.md"
license = "LicenseRef-Proprietary"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "datasketch>=1.6,<3",
    "lxml>=5,<7",
    "numpy>=2,<3",
    "pydantic>=2,<3",
    "tldextract>=5.4,<6",
]

[project.optional-dependencies]
app = [
    "networkx>=3.2,<4",
    "plotly>=5.24,<7",
    "streamlit>=1.40,<2",
]
# Models and native libraries for ftf.features (OCR, embeddings, faces, video); heavy, so opt-in.
features = [
    "beautifulsoup4>=4.12,<5",
    "huggingface_hub>=0.24,<2",
    "lxml>=5,<7",
    "onnxruntime>=1.18,<2",
    "pillow>=10,<14",
    "tokenizers>=0.19,<1",
]
dev = [
    "packaging>=24",
    "pytest==9.2.0",
]
fetch = [
    "playwright==1.64.1",
]

[project.scripts]
ftf = "ftf.cli:main"

[tool.setuptools.dynamic]
version = { attr = "ftf.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.setuptools.package-data]

"ftf.indicators" = ["stoplist.json"]
